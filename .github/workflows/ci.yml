name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LABDOCS_OPENAPI_FILE: /tmp/labdocs-openapi.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Install locked backend dependencies
        run: uv sync --frozen
      - name: Export schema from the checked-out app factory
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from app.main import create_app
          Path(os.environ['LABDOCS_OPENAPI_FILE']).write_text(json.dumps(create_app().openapi()))
          PY
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Strict TypeScript (no emit)
        working-directory: frontend
        run: npm run typecheck
      - name: Lint (warnings fail)
        working-directory: frontend
        run: npm run lint
      - name: Vitest
        working-directory: frontend
        run: npm test
      - name: Generated-type freshness
        working-directory: frontend
        run: npm run check:types
      - name: Production build and initial-route budget
        working-directory: frontend
        run: npm run build && npm run check:bundle

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Validate compose configuration
        run: docker compose config -q

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: labdocs
          POSTGRES_PASSWORD: labdocs
          POSTGRES_DB: labdocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labdocs -d labdocs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    env:
      LABDOCS_DATABASE_URL: postgresql+asyncpg://labdocs:labdocs@localhost:5432/labdocs_test
      LABDOCS_TEST_DATABASE_URL: postgresql+asyncpg://labdocs:labdocs@localhost:5432/labdocs_test
      LABDOCS_TEST_QDRANT_URL: http://localhost:6333
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations against Postgres
        run: uv run alembic upgrade head

      - name: Check migrations match SQLAlchemy metadata
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest

  browser:
    name: Browser (fake provider)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: labdocs
          POSTGRES_PASSWORD: labdocs
          POSTGRES_DB: labdocs_frontend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labdocs -d labdocs_frontend_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Install locked dependencies
        run: uv sync --frozen && npm ci --prefix frontend
      - name: Install Chromium and system libraries
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Full browser suite (isolated test app factory and fake provider only)
        working-directory: frontend
        run: npm run test:e2e
      - name: Large-corpus browser regression
        working-directory: frontend
        run: npm run test:performance
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence
          path: |
            frontend/test-results/
            docs/screenshots/f6/
            docs/verification/frontend-f6/
