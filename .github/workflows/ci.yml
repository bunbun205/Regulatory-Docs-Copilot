name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Validate compose configuration
        run: docker compose config -q

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: labdocs
          POSTGRES_PASSWORD: labdocs
          POSTGRES_DB: labdocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labdocs -d labdocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LABDOCS_DATABASE_URL: postgresql+asyncpg://labdocs:labdocs@localhost:5432/labdocs
      LABDOCS_TEST_DATABASE_URL: postgresql+asyncpg://labdocs:labdocs@localhost:5432/labdocs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations against Postgres
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest
