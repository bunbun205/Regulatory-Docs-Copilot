services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: labdocs
      POSTGRES_PASSWORD: labdocs
      POSTGRES_DB: labdocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labdocs -d labdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
