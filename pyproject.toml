[project]
name = "labdocs"
version = "0.1.0"
description = "Regulatory Docs Copilot: FastAPI RAG backend with agentic search and compliance gap checking."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "prometheus-client>=0.20.0",
    "structlog>=0.40.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "pypdf>=5.1",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3,<7",
    "python-multipart>=0.0.20",
    "httpx>=0.27.0",
    "torch>=2.2,<2.7",
    "qdrant-client>=1.12,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
